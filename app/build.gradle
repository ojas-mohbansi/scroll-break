plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
}

android {
    namespace 'com.cascade26.scrollbreak'
    compileSdk 37

    defaultConfig {
        applicationId "com.cascade26.scrollbreak"
        minSdk 28
        targetSdk 37
        versionCode 19
        versionName 'Pumpkin 14'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    def hasSigningProps = project.hasProperty('KEYSTORE_FILE') && project.hasProperty('KEYSTORE_PASSWORD') && project.hasProperty('KEY_ALIAS') && project.hasProperty('KEY_PASSWORD')

    if (hasSigningProps) {
        signingConfigs {
            shared {
                storeFile file(KEYSTORE_FILE)
                storePassword KEYSTORE_PASSWORD
                keyAlias KEY_ALIAS
                keyPassword KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            if (hasSigningProps) {
                signingConfig signingConfigs.shared
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
    implementation libs.androidx.preference
    implementation libs.androidx.biometric
    implementation libs.localbroadcastmanager

    //My Dependencies
    implementation libs.androidx.core.splashscreen
    implementation libs.mpandroidchart
    implementation libs.lottie

    //circular progressbar
    implementation libs.circularprogressindicator

    // GSON for JSON serialization
    implementation libs.gson

    //Swiper Recyclerview
    implementation libs.swipereveallayout.android

    //Gradient progressbar
    implementation libs.progressview
    implementation libs.lib.circularseekbar

    //MPAndroidChart
    implementation libs.mpandroidchart

    //Chat bubble
    implementation libs.balloon



    // Room (SQLite ORM)
    implementation libs.androidx.room.runtime
